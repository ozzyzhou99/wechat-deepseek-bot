[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-deepseek-bot"
version = "0.2.0"
description = "A lightweight, configurable WeChat group bot powered by DeepSeek."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
wechat-deepseek-bot = "wechat_deepseek_bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechat_deepseek_bot = ["persona/personas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
